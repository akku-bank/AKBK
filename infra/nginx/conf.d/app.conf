server {
    listen 80;
    server_name J14B101T.p.ssafy.io;

    # certbot이 http-01 challenge 파일을 이 경로로 확인함
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # [인증서 발급 후]
    # 아래 return 301 줄의 주석을 해제하고,
    # 아래 임시 location / 블록은 다시 주석처리
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # =========================
    # 인증서 발급 전 임시 HTTP 확인용
    # =========================
    location / {
        return 200 'nginx http is running';
        add_header Content-Type text/plain;
    }

    # HTTP 상태에서도 /api 프록시는 가능하게 둘 수 있음
    # 인증서 발급 전 백엔드 연결 확인용으로 사용 가능
    location /api/ {
        proxy_pass http://akku_backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

