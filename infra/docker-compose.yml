services:
  jenkins:
    build: ./jenkins
    container_name: jenkins-server
    restart: always
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - ./jenkins/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Seoul

