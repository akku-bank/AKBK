services:
  jenkins:
    build: ./jenkins
    container_name: jenkins-server
    restart: always
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - ./jenkins/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/S14P21B101:/home/ubuntu/S14P21B101
    environment:
      - TZ=Asia/Seoul

  nginx:
    build: ./nginx
    container_name: akku_nginx
    restart: always
    ports:
      - "80:80"
    networks:
      - proxy_net

networks:
  proxy_net:
    name: akku_proxy_net
    driver: bridge