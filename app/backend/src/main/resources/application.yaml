spring:
  application:
    name: akku-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:akku_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ssafy}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false # P6Spy와 중복 출력 막기 위해 false로 변경
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    # 환경 변수가 있으면 그걸 쓰고, 없으면 29092 사용
    # Consumer / Producer 세부 설정은 global.kafka.config.KafkaConfig 에서 프로그래밍 방식으로 관리
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:akkubangkku_kafka:29092}

# 카카오 소셜 로그인
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  user-info-uri: https://kapi.kakao.com/v2/user/me

# Firebase 설정
firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:}

# JWT 설정
jwt:
  secret: ${JWT_SECRET:akku-jwt-secret-key-must-be-at-least-32-characters-long}
  access-token-expiration: 3600000      # 1시간 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)

# SSAFY 금융망 API
ssafy:
  api:
    base-url: https://finopenapi.ssafy.io/ssafy/api/v1
    key: ${SSAFY_API_KEY:}

# Swagger / SpringDoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
decorator:
  datasource:
    p6spy:
      enable-logging: true # 로컬에서는 켜서 쿼리 성능(ms) 확인
      multiline: true      # 쿼리를 한 줄이 아니라 보기 좋게 여러 줄로 줄바꿈해서 출력
      logging: slf4j       # 스프링 부트 기본 로그(콘솔)에 출력되도록 설정

# ==========================================================

# --- 실제 운영 환경 설정 (spring.profiles.active: prod) ---
# 추후 배포용 yaml(application-prod.yaml) 만들 때 아래처럼 꼭 수정
# decorator:
#   datasource:
#     p6spy:
#       enable-logging: false # 운영 환경에서는 성능 방어를 위해 무조건 끄기
# ==========================================================
# --- 로깅(Logging) 설정 ---
# ==========================================================
logging:
  pattern:
    # 콘솔 로그 출력 포맷 정의
    # %X{traceId}: MDC에 저장된 traceId 값을 출력. 값이 없으면 빈칸으로 처리됨
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId}] --- [%15.15t] %-40.40logger{39} : %m%n"
  level:
    root: INFO
    # 프로젝트 기본 패키지(com.akku.backend)의 로그 레벨 설정
    # 로컬 개발 시에는 DEBUG로 두어 상세한 파라미터나 흐름을 확인하는 것이 좋음
    com.akku.backend: DEBUG

# FAST API 연동용
external:
  fastapi:
    base-url: "http://localhost:8000" # 로컬 테스트용. 개발/운영 환경에 맞춰 분리 필요

# =========================================================
# Kafka 토픽명 / 컨슈머 그룹 ID
# 토픽명과 그룹 ID는 이 곳에서 한 번만 선언한다.
# 코드에서는 @Value("${akku.kafka.topic.*}") 또는
# KafkaTopicProperties 빈으로 주입해 사용한다.
# =========================================================
akku:
  kafka:
    topic:
      quiz-chat-request:  quiz.chat.request
      quiz-chat-response: quiz.chat.response
      payment:            payment
      transfer:           transfer
      deposit:            deposit
      transaction:        transaction
    consumer:
      group:
        quiz-chat:               quiz-chat-group
        payment-storage:         payment-storage-group
        transfer-storage:        transfer-storage-group
        deposit-storage:         deposit-storage-group
        transaction-notification: transaction-notification-group
        transaction-jelly:       transaction-jelly-group
# 암호화 설정
encryption:
  key: ${ENCRYPTION_KEY:}
