spring:
  application:
    name: akku-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:akku_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ssafy}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false   # 운영 환경에서는 false (개발 시 true로 변경)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

# 카카오 소셜 로그인
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  user-info-uri: https://kapi.kakao.com/v2/user/me

# JWT 설정
jwt:
  secret: ${JWT_SECRET:akku-jwt-secret-key-must-be-at-least-32-characters-long}
  access-token-expiration: 3600000      # 1시간 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)

# SSAFY 금융망 API
ssafy:
  api:
    base-url: https://fiapi.ssafy.io
    key: ${SSAFY_API_KEY:}

# Swagger / SpringDoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
