services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ai/db/init:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.7.1-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USERNAME}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./ai/airflow/requirements.txt:/opt/airflow/requirements.txt
    command: >
      bash -c "airflow db init && airflow users create --username ${AIRFLOW_USERNAME} --password ${AIRFLOW_PASSWORD} --firstname admin --lastname admin --role Admin --email admin@example.com"
  airflow:
    image: apache/airflow:2.7.1-python3.11
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - VECTOR_DB_NAME=${VECTOR_DB_NAME}
      - OPENAI_API_KEY=${GMS_API_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - GMS_API_KEY=${GMS_API_KEY}
      - PYTHONPATH=/opt/airflow/dags:/opt/airflow/lib
    volumes:
      - ./ai/airflow/dags:/opt/airflow/dags
      - ./ai/airflow/lib:/opt/airflow/lib
      - ./ai/airflow/requirements.txt:/opt/airflow/requirements.txt
    ports:
      - "9000:8080"
    command: bash -c "python -m pip install --no-cache-dir -r /opt/airflow/requirements.txt && airflow scheduler & airflow webserver"

  ai-server:
    build:
      context: .
      dockerfile: ai/Dockerfile
    container_name: ai_server
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # 코드 변경 시 컨테이너 내부의 /app 디렉토리에 자동 반영
      - .:/app # 배포 시 삭제 !!!!!
    ports:
      - "8000:8000"
    restart: always
    command: uvicorn ai.main:app --host 0.0.0.0 --port 8000 --reload

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: akkubangkku_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  # Kafka 메시지 브로커
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: akkubangkku_kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: akkubangkku_zookeeper:2181

      # 내부 도커 통신용: akkubangkku_kafka:29092
      # 로컬 호스트 접속용: localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://akkubangkku_kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: akkubangkku_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: Akkubangkku-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: akkubangkku_kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: akkubangkku_zookeeper:2181
    depends_on:
      - kafka

  # Kafka 토픽 자동 생성 init 컨테이너
  kafka-init:
    build:
      context: ./data/kafka-init
    container_name: akkubangkku_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  zookeeper_data:
  kafka_data:
