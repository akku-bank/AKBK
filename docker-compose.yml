services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ai/db/init:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.7.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USERNAME}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD}
    volumes:
      - ./ai/airflow/requirements.txt:/opt/airflow/requirements.txt
    command: bash -c "python -m pip install --no-cache-dir -r /opt/airflow/requirements.txt && airflow version"

  airflow:
    image: apache/airflow:2.7.1
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - VECTOR_DB_NAME=${VECTOR_DB_NAME}
      - OPENAI_API_KEY=${GMS_API_KEY}
    volumes:
      - ./ai/airflow/dags:/opt/airflow/dags
      - ./ai/airflow/lib:/opt/airflow/lib
      - ./ai/airflow/requirements.txt:/opt/airflow/requirements.txt
    ports:
      - "9000:8080"
    command: bash -c "python -m pip install --no-cache-dir -r /opt/airflow/requirements.txt && airflow scheduler & airflow webserver"

  ai-server:
    build:
      context: .
      dockerfile: ai/Dockerfile
    container_name: ai_server
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:    # 코드 변경 시 컨테이너 내부의 /app 디렉토리에 자동 반영
      - .:/app  # 배포 시 삭제 !!!!!
    ports:
      - "8000:8000"
    restart: always
    command: uvicorn ai.main:app --host 0.0.0.0 --port 8000 --reload


volumes:
  postgres_data:
